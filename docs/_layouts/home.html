<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }} - SwitchcraftKeys</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  
  {% seo %}
  
  <link rel="icon" type="image/png" href="{{ '/assets/images/app-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Top Navigation -->
  <nav class="top-nav">
    <a href="{{ '/' | relative_url }}" class="nav-brand">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="SwitchcraftKeys">
      <span>SwitchcraftKeys</span>
    </a>
    
    <button class="nav-toggle" onclick="toggleNav()" aria-label="Toggle navigation">☰</button>
    
    <ul class="nav-links" id="navLinks">
      <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.url == '/index.html' %}class="nav-active"{% endif %}>Home</a></li>
      <li><a href="{{ '/user-manual' | relative_url }}" {% if page.url contains 'user-manual' %}class="nav-active"{% endif %}>Manual</a></li>
      <li><a href="{{ '/troubleshooting' | relative_url }}" {% if page.url contains 'troubleshooting' %}class="nav-active"{% endif %}>Troubleshoot</a></li>
      <li><a href="{{ '/docs' | relative_url }}" {% if page.url contains 'docs' %}class="nav-active"{% endif %}>Docs</a></li>
      <li><a href="{{ '/architecture' | relative_url }}" {% if page.url contains 'architecture' %}class="nav-active"{% endif %}>Architecture</a></li>
      <li><a href="https://github.com/{{ site.github_username }}/{{ site.repository | split: '/' | last }}" target="_blank">GitHub</a></li>
    </ul>
  </nav>

  {{ content }}

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-links">
      <a href="{{ '/docs' | relative_url }}">Documentation</a>
      <a href="https://github.com/{{ site.github_username }}/{{ site.repository | split: '/' | last }}">GitHub</a>
      <a href="https://github.com/{{ site.github_username }}/{{ site.repository | split: '/' | last }}/releases">Releases</a>
      <a href="https://github.com/{{ site.github_username }}/{{ site.repository | split: '/' | last }}/issues">Issues</a>
    </div>
    <p class="footer-copy">
      &copy; {{ site.time | date: '%Y' }} {{ site.author }}. 
      <a href="{{ '/attributions' | relative_url }}">Attributions</a> · 
      <a href="https://github.com/{{ site.github_username }}/{{ site.repository | split: '/' | last }}/blob/main/LICENSE">MIT License</a>
    </p>
  </footer>

  <!-- Lightbox for images -->
  <div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
      <button class="lightbox-nav lightbox-prev" onclick="prevImage()">&lsaquo;</button>
      <img id="lightboxImg" src="" alt="">
      <button class="lightbox-nav lightbox-next" onclick="nextImage()">&rsaquo;</button>
      <p class="lightbox-caption" id="lightboxCaption"></p>
    </div>
  </div>

  <script>
    // Mobile nav toggle
    function toggleNav() {
      document.getElementById('navLinks').classList.toggle('open');
    }

    // Lightbox
    let lightboxImages = [];
    let currentImageIndex = 0;

    document.addEventListener('DOMContentLoaded', function() {
      // Collect all clickable images
      const images = document.querySelectorAll('.screenshot-item img, [data-lightbox]');
      lightboxImages = Array.from(images);
      
      images.forEach((img, index) => {
        img.addEventListener('click', () => openLightbox(index));
      });

      // Scroll reveal
      const reveals = document.querySelectorAll('[data-reveal]');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('revealed');
          }
        });
      }, { threshold: 0.1 });

      reveals.forEach(el => observer.observe(el));

      // Stagger children
      document.querySelectorAll('[data-stagger]').forEach(container => {
        Array.from(container.children).forEach((child, i) => {
          child.style.setProperty('--i', i);
        });
      });
    });

    function openLightbox(index) {
      currentImageIndex = index;
      const img = lightboxImages[index];
      document.getElementById('lightboxImg').src = img.src;
      document.getElementById('lightboxCaption').textContent = img.dataset.caption || img.alt || '';
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    function prevImage() {
      currentImageIndex = (currentImageIndex - 1 + lightboxImages.length) % lightboxImages.length;
      openLightbox(currentImageIndex);
    }

    function nextImage() {
      currentImageIndex = (currentImageIndex + 1) % lightboxImages.length;
      openLightbox(currentImageIndex);
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') prevImage();
      if (e.key === 'ArrowRight') nextImage();
    });
  </script>
</body>
</html>
