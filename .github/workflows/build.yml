name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore src/SwitchcraftKeys/SwitchcraftKeys.csproj

    - name: Build
      run: dotnet build src/SwitchcraftKeys/SwitchcraftKeys.csproj -c Release --no-restore

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SwitchcraftKeys-build
        path: src/SwitchcraftKeys/bin/Release/net8.0/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    strategy:
      matrix:
        include:
          - arch: x64
            installer: true
          - arch: arm64
            installer: false
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install NSIS (Windows)
      if: matrix.installer
      run: |
        $ErrorActionPreference = 'Stop'
        $nsispath = "${env:ProgramFiles(x86)}\NSIS"
        if (Test-Path $nsispath) {
          Write-Host "NSIS already installed"
        } else {
          choco install nsis --no-progress -y
        }

    - name: Build release
      shell: pwsh
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        $installer = if ("${{ matrix.installer }}" -eq "true") { "-Installer" } else { "" }
        pwsh -File build/build-release.ps1 -Version $version -Arch "${{ matrix.arch }}" $installer.Split()

    - name: Verify native executable in package
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        zips=(dist/SwitchcraftKeys-*.zip)
        if [ ${#zips[@]} -eq 0 ]; then
          echo "::error::No ZIP found in dist/"
          exit 1
        fi
        zip="${zips[0]}"
        echo "Verifying: $(basename "$zip")"
        expected="SwitchcraftKeys.exe"
        if unzip -l "$zip" 2>/dev/null | awk 'NR>3 && !/^---------/ {print $NF}' | grep -qxF "$expected"; then
          echo "✅ '$expected' present"
        else
          echo "::error::Missing '$expected' in $(basename "$zip")"
          unzip -l "$zip"
          exit 1
        fi

    - uses: actions/upload-artifact@v4
      with:
        name: release-win-${{ matrix.arch }}
        path: dist/SwitchcraftKeys-*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        merge-multiple: true
        path: dist

    - name: Display structure
      run: ls -lh dist/

    - name: Generate checksums body
      run: |
        echo "" > release-body.md
        echo "---" >> release-body.md
        echo "" >> release-body.md
        echo "## ✅ SHA256 Checksums" >> release-body.md
        echo "" >> release-body.md
        echo '```' >> release-body.md
        (cd dist && sha256sum *) >> release-body.md
        echo '```' >> release-body.md
        echo "" >> release-body.md
        echo "VirusTotal scan in progress — results appended automatically." >> release-body.md

    - name: Update Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        body_path: release-body.md
        append_body: true
        fail_on_unmatched_files: false

    - name: VirusTotal Scan
      uses: cssnr/virustotal-action@v1
      continue-on-error: true
      with:
        vt_api_key: ${{ secrets.VT_API_KEY }}
        file_globs: dist/*.zip
        sha256: true
        update_release: true
        release_id: ${{ steps.create_release.outputs.id }}
        release_heading: '### 🔬 VirusTotal'
        collapsed: true
